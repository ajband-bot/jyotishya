- id: REM-NOGEM-SUN
  title: Gemstone remedy CONTRAINDICATED for Sun
  category: remedy
  source_tier: 1
  source_ref: docs/domain-playbooks.md Remedy Safety Rule 1 (NEVER prescribe a gemstone
    for a functional malefic)
  tradition: parasari
  conditions:
  - path: remedies.planets.Sun.gemstone_contraindicated
    op: eq
    value: true
    description: Sun's gemstone is contraindicated
  outputs:
  - kind: classification
    payload:
      planet: Sun
      effect: Sun is functionally malefic (or, for Rahu/Ketu, lacks its documented
        narrow exception) -- gemstone amplification is unsafe. Dana of Sun's significations
        is the preferred remedy (Rule 5).
  confidence: high
  status: ACTIVE
  computation_model: classical
  notes:
  - Safety-critical rule family -- directly implements Remedy Safety Rule 1, the single
    most important gate in this pack.

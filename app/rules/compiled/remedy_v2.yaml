- id: REM-SAT-SPECIAL
  title: Saturn blocked by the yogakaraka-only gemstone gate
  category: remedy
  source_tier: 1
  source_ref: docs/domain-playbooks.md Remedy Safety Rule 6 (NEVER blue sapphire unless
    Saturn is yogakaraka)
  tradition: parasari
  conditions:
  - path: remedies.planets.Saturn.blocked_by_yogakaraka_gate
    op: eq
    value: true
    description: Saturn is functional_benefic (kendra-only inversion) but NOT yoga_karaka
  outputs:
  - kind: classification
    payload:
      effect: Saturn's generic functional_benefic status (natural-malefic-ruling-kendra-only
        inversion) is NOT sufficient for blue sapphire -- Rule 6 requires the stricter
        yogakaraka test specifically, which this chart does not meet.
  confidence: high
  status: ACTIVE
  computation_model: classical
  notes:
  - Demonstrates the safety rule actually blocking what a naive generic-benefic reading
    would have wrongly allowed.
- id: REM-RAHU-SPECIAL
  title: Rahu's narrow hessonite exception is met
  category: remedy
  source_tier: 4
  source_ref: docs/domain-playbooks.md Remedy Safety Rule 7 (NEVER hessonite unless
    Rahu is well-placed and its dispositor is strong)
  tradition: parasari
  conditions:
  - path: remedies.planets.Rahu.well_placed_and_strong_dispositor
    op: eq
    value: true
    description: Rahu is not in a dusthana AND its sign dispositor is strong/very_strong
  outputs:
  - kind: classification
    payload:
      effect: Rahu is well-placed (not in a dusthana) and its sign dispositor tests
        strong -- Rule 7's narrow exception is met, so hessonite may be considered
        (still not a default recommendation).
  confidence: medium
  status: ACTIVE
  computation_model: classical
  notes:
  - Reports that the exception CONDITION is met -- does not itself force a gemstone
    recommendation, per Rule 7's own cautious framing.

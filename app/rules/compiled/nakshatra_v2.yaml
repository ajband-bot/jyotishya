        Deva (sattvic, generous). Tattva: Earth. Yoni: Horse (M). Underlying motivation
        (puruṣārtha): Dharma.'
  confidence: high
  status: ACTIVE
  computation_model: classical
  notes:
  - Migrated from app.knowledge.nakshatras.NAKSHATRA_PROFILES (itself transcribed
    from docs/nakshatra-framework.md §1) per build_plan.md §3.2 workflow.
  - Keyed on the MOON's nakṣatra (Janma Nakṣatra) specifically -- the primary application
    per docs/nakshatra-framework.md §9 item 5. The underlying app.derived.nakshatra_analysis
    engine computes this profile for every planet, not just Moon; a future rule set

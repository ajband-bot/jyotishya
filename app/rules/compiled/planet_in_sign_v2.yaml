- id: PIS-SUN-01
  title: Sun in Aries
  category: dignity
  source_tier: 3
  source_ref: Compositional synthesis of BPHS Ch.10/Saravali Ch.2 karakatva (app.knowledge.planets.KARAKATVA)
    + BPHS Ch.3 sign dignity (app.astro.constants.PLANET_STATES/SIGNS); not a per-sign
    Brihat Jataka verse citation.
  tradition: parasari
  conditions:
  - path: chart.Sun.sign
    op: eq
    value: 1
    description: Sun occupies Aries
  outputs:
  - kind: classification
    payload:
      planet: Sun
      sign: 1
      sign_en: Aries
      effect: 'Sun''s natural significations (father, authority, government) filtered
        through Aries (Fire element, Cardinal quality). Dignity: exalted -- at its
        classical peak here -- these themes express with maximum ease and confidence.'
  confidence: medium
  status: ACTIVE
  computation_model: practical_proxy
  notes:
  - category=dignity is broader here than formal exalt/own/debil tiers alone -- this
    rule set covers the full qualitative planet+sign combination, not just the 3-state
    dignity table; no dedicated category exists for 'planet-in-sign' specifically
    and force-fitting a brand-new enum entry for 108 mechanically-generated entries
    was judged unwarranted (YAGNI) versus reusing 'dignity' with this note.
  - computation_model=practical_proxy -> generic evaluator reports quality=computed_simplified.

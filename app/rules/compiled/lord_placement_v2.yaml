- id: LPH-01-01
  title: Lord of House 1 in House 1
  category: lord_placement
  source_tier: 3
  source_ref: Compositional synthesis of BPHS Ch.11 / Saravali Ch.4 / Phaladeepika
    Ch.7 house significations (see app.knowledge.houses.HOUSES) via BPHS's own source-house
    + destination-house combination method; not a per-combination direct verse citation.
  tradition: parasari
  conditions:
  - path: lord_placements.1.occupies_house
    op: eq
    value: 1
    description: Lord of House 1 occupies House 1
  outputs:
  - kind: classification
    payload:
      source_house: 1
      dest_house: 1
      effect: Lord of the 1st house (Lagna/Self) sits in its own house -- a self-supporting
        placement that concentrates lagna/self matters directly in their own domain,
        without needing to be routed through another house's affairs.
  confidence: medium
  status: ACTIVE
  computation_model: practical_proxy
  notes:
  - This rule is lagna-agnostic by design -- it fires on the computed lord_placements
    field, not on any fixed planet, so it applies identically regardless of which
    planet ends up ruling House 1 for a given chart.
  - computation_model=practical_proxy -> generic evaluator reports quality=computed_simplified
    even when the condition matches cleanly (build_plan.md Phase 2 item 1).

    L5: {name: D1_D9_CrossReference, factors: "12-16", key_rule: D1 promises; D9 confirms}
    L6: {name: Dasha_Transit_Timing, factors: "16-20", method: 5_layer_dasha_plus_gochara}
    L7: {name: Full_10Layer_Synthesis, factors: "20+", output: complete_life_narrative_timing_remedies}

  five_dasha_reading_layers:
    1: Houses owned by MD lord -- which themes activate this period
    2: House occupied by MD lord -- where events play out
    3: Dignity of MD lord -- full vs reduced expression
    4: Aspects received by MD lord -- support vs obstacles
    5: D9 dignity of MD lord -- inner quality of the period

  three_lens_prediction_model:
    D1: Promise
    D9: Confirmation
    Dasha_Transit: Timing
    rule: All 3 aligned means event WILL manifest; 2/3 means partial or delayed; 1/3 means not this period


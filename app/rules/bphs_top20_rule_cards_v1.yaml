meta:
  version: v1
  source_priority: BPHS-first
  source_pdf: BPHS - 1 RSanthanam.pdf
  method:
  - Extracted BPHS TOC and keyword signals from readable PDF text
  - Prioritized by scriptural centrality, dependency value, predictive impact, graph
    readiness
  notes:
  - Companion reference PDFs in Telugu require OCR/font decoding for reliable machine
    reading
  - This set is intentionally foundational for D1 and D9 first
  - sloka_range values are parser-estimated from extracted verse markers and should
    be manually audited against the Sanskrit print before production locking
  citation_audit:
    audit_date: '2026-04-11'
    audit_method: chapter-window + verse-range + topic-token validation against extracted
      BPHS text
    audit_scope: all rule card citations
  graha_condition_policy:
    status: active
    applied_in: graha_strength_modifier
    source: Jyotish_Learning_Part2_Calculations.md (CALC-7, CALC-8); Part5 Cheat Sheets 2,6
    notes:
    - Combustion, retrograde state, and friend/enemy dignity are mandatory sub-factors
      in normalized graha strength.
    - These modifiers do not replace base rule fulfillment; they scale it.
    sub_factors:
      combustion:
        accounted: true
        formula: abs(planet_long - sun_long); if diff > 180 use 360 - diff; COMBUST if diff < orb
        orbs_degrees:
          Moon: 12
          Mercury: 14
          Mercury_retrograde: 13
          Venus: 10
          Venus_retrograde: 8
          Mars: 17
          Jupiter: 11
          Saturn: 15
          Rahu: null  # cannot be combust — mathematical point
          Ketu: null  # cannot be combust — mathematical point
        impact_ranking: Jupiter_combust > Venus_combust > Saturn_combust > Mars_combust > Moon_combust > Mercury_combust
        note: Mercury combust is most frequent (never >28° from Sun) and least severe
        multiplier:
          combust: 0.70
          safe: 1.0
      retrograde:
        accounted: true
        formula: speed < 0 from ephemeris; Sun and Moon never retrograde; Rahu/Ketu always retrograde
        source_rule: BPHS Ch3 — "Vakri-grahaḥ ucca-tulyaḥ" (retrograde ≈ exalted in power)
        multiplier:
          retrograde_in_exaltation: 1.30   # extraordinarily powerful
          retrograde_in_own_sign: 1.20
          retrograde_neutral: 1.10         # internalized but stronger
          retrograde_enemy: 0.95           # delayed expression
          direct: 1.0
      natural_relationship:
        accounted: true
        table:
          Sun:     {friends: [Moon, Mars, Jupiter], neutral: [Mercury], enemies: [Venus, Saturn]}
          Moon:    {friends: [Sun, Mercury], neutral: [Mars, Jupiter, Venus, Saturn], enemies: []}
          Mars:    {friends: [Sun, Moon, Jupiter], neutral: [Venus, Saturn], enemies: [Mercury]}
          Mercury: {friends: [Sun, Venus], neutral: [Mars, Jupiter, Saturn], enemies: [Moon]}
          Jupiter: {friends: [Sun, Moon, Mars], neutral: [Saturn], enemies: [Mercury, Venus]}
          Venus:   {friends: [Mercury, Saturn], neutral: [Mars, Jupiter], enemies: [Sun, Moon]}
          Saturn:  {friends: [Mercury, Venus], neutral: [Jupiter], enemies: [Sun, Moon, Mars]}
        multiplier:
          mutual_friend: 1.10
          friend_neutral: 1.05
          mutual_neutral: 1.0
          friend_enemy: 0.95
          neutral_enemy: 0.92
          mutual_enemy: 0.85
      temporal_relationship:
        accounted: true
        note: Planets in H2/H3/H4/H10/H11/H12 from each other (natal) = temporary friends
        multiplier:
          mutual_temporal_friend: 1.08
          temporal_neutral: 1.0
          mutual_temporal_enemy: 0.92
      combined_relationship:
        note: Both natural AND temporal relationships combined per BPHS rule
        multiplier:
          great_friend: 1.15   # friend in both natural and temporal
          friend: 1.10
          neutral: 1.0
          enemy: 0.90
          bitter_enemy: 0.80   # enemy in both natural and temporal
      functional_benefic_malefic:
        accounted: true
        note: Determined by house lordship for specific Lagna; overrides natural classification
        yoga_karaka_bonus: 1.20   # owns both Kendra + Trikona
        trikona_only_bonus: 1.10
        kendra_only_neutral: 1.0  # Kendradhipati Dosha for natural benefics
        dusthana_lord_penalty: 0.85
        maraka_lord_penalty: 0.80
      dignity_levels:
        exaltation: 1.30
        vargottama: 1.20        # same sign in D1 and D9
        own_sign: 1.15
        moolatrikona: 1.12
        great_friend: 1.10
        friend: 1.05
        neutral: 1.0
        enemy: 0.90
        debilitation: 0.70
        neechabhanga: 1.10      # debilitation cancelled → becomes powerful
    implementation_rule:
    - Final graha_strength_modifier = dignity × combustion × retrograde × combined_relationship × functional_role
    - All factors are multiplicative; apply in that order
    - If data is missing for a sub-factor, use neutral multiplier 1.0 and mark low-confidence
      trace in explanation.
    - "Neechabhanga conditions (CALC-9 source) -- debil sign lord in Kendra; exalt sign lord in Kendra; debilitated planet retrograde; conjunct exalted planet; exalt lord aspects debil planet"
rule_cards:
- priority: 1
  rule_id: RC-001
  rule_name: Graha Nature and Functional Role
  authority_tier: T1
  chapter_signal: 'Chapter 3: Planetary Characters and Description'
  domain_tags:
  - foundation
  - classification
  why_top20: All interpretation layers depend on baseline nature and functional behavior
    of planets by ascendant context.
  score_weight_hint: high
  card_fields:
    canonical_statement: Define natural graha nature and ascendant-based functional
      role before all outcome rules.
    activation_conditions:
    - Lagna is known
    - Planet under evaluation is known
    exclusions:
    - Do not use natural benefic/malefic alone without lordship context
    default_modifiers:
    - functional_role_override_by_lordship
    scoring_hooks:
      base_fulfillment: binary
      graha_strength_modifier: required
      divisional_support_modifier: optional
    graph_mapping:
      requires_nodes:
      - Lagna
      - GrahaState
      produces_nodes:
      - RuleEvaluation
      edge_types:
      - RULE_REQUIRES_CONDITION
      - RULE_MODIFIES_RULE
    citations:
    - text: BPHS
      chapter: 3
      sloka_range: 2-70 (parser-est.)
      translation_snippet: benefics and malefics, planetary governances
      citation_status: verified_range_and_topic
      audit_note: Range 2-70 within extracted chapter markers 2-70 and topic token
        matched
    examples:
    - 'Sandeep (Capricorn lagna): Saturn is Lagna lord (H1+H2 owner) = foundational personal identity marker. Same Saturn rules Career house H10 for professional expression. Result: Personal discipline = professional structure.'
    - 'Ajay (Scorpio lagna): Same Saturn rules H7+H8 (marriage + mortality) = functional maraka+dusthana malefic despite natural benefic role. Result: Saturn delays/tests relationships; requires spiritual maturity for processing.'
  citation_status: verified

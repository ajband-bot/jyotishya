  dasha_granularity_rules:

  - rule_id: DG-001
    rule_name: Antardasha Event Precision Layer
    authority_tier: T4
    domain_tags: [dasha, antardasha, timing, sub-period]
    ocr_signal: VA304 dasha(11); VA326 dasha(6)
    canonical_statement: >
      Within a Mahadasha, each sub-lord (antardasha bhukti lord) activates
      the natal promise of BOTH the mahadasha lord AND the antardasha lord
      simultaneously. The event fires when both lords relate to the relevant
      house/yoga through ownership, aspect, or karaka role, and when the
      antardasha lord's natal strength is not severely afflicted.
    activation_conditions:
    - Mahadasha lord identified and natal position evaluated
    - Antardasha lord identified and relationship with mahadasha lord computed
    - Both lords' house associations evaluated for the event domain
    exclusions:
    - If mahadasha lord is strong but antardasha lord is severely afflicted
      (combust + debilitated), reduce confidence to low
    scoring_hooks:
      base_fulfillment: joint_lord_activation
      dasha_lord_strength_modifier: required
      antardasha_lord_strength_modifier: required
      mutual_relation_modifier:
        friend: 1.1
        neutral: 1.0
        enemy: 0.85
    graph_mapping:

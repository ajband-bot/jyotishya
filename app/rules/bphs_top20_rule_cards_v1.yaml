    Malavya: {planet: Venus,   signs: [Taurus, Libra, Pisces], quality: artistic_wealthy}
    Shasha:  {planet: Saturn,  signs: [Capricorn, Aquarius, Libra], quality: disciplined_authority}

  neechabhanga_rule:
    result_multiplier: 1.25
    conditions:
    - Debilitation sign lord is in Kendra from Lagna or Moon
    - Exaltation sign lord of debilitated planet is in Kendra
    - Debilitated planet is retrograde
    - Debilitated planet conjuncts an exalted planet
    - Exaltation lord of the debilitated planet aspects it


    rule_name: Vedha Obstruction in Transit
    authority_tier: T4
    domain_tags: [transit, vedha, obstruction, cancellation]
    ocr_signal: VA325 yoga(18)
    canonical_statement: >
      Each of the 12 signs has a specific Vedha sign pair. If a favorable
      transiting planet occupies a sign AND another planet simultaneously
      transits the Vedha sign for that first planet, the favorable results
      are cancelled. Exception: Sun-Saturn, Moon-Mercury, and Mars-Jupiter
      do not Vedha each other. This rule applies to all seven classical
      planets; Rahu/Ketu Vedha relationships are system-dependent.
    activation_conditions:
    - Favorable transit planet in beneficial sign identified
    - All other concurrent transit positions evaluated
    - Vedha table for the favorable planet's sign loaded
    exclusions:
    - Sun-Saturn mutual Vedha is suspended per traditional exception
    - Moon-Mercury mutual Vedha is suspended
    - Mars-Jupiter mutual Vedha is suspended
    scoring_hooks:
      base_fulfillment: vedha_check_binary
      vedha_active_multiplier: 0.65
      vedha_absent_multiplier: 1.0
    graph_mapping:
      requires_nodes: [FavorableTransitPlanet, ConcurrentTransits, VedhaTable]

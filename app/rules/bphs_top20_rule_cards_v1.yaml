# ===============================================================================
# CALCULATION PIPELINE
# Source: Jyotish_Learning_Part2_Calculations.md (CALC-1 to CALC-15)
#         Jyotish_Learning_Part5_Reference.md (Cheat Sheets 1-9)
# ===============================================================================

calculation_pipeline:
  source_files:
  - /Users/a0b1803/Documents/jyotisha/Jyotish_Learning_Part2_Calculations.md
  - /Users/a0b1803/Documents/jyotisha/Jyotish_Learning_Part5_Reference.md
  pipeline_source: Meeus + BPHS + Swiss Ephemeris SIDM_LAHIRI
  total_steps: 15

  steps:

  - calc_id: CALC-1
    name: Birth Data to UTC Conversion
    source: Meeus Ch.1
    inputs: [birth_date_DDMMYYYY, birth_time_HHMMSS_local, timezone_offset]
    outputs: [utc_date, utc_time_HHMMSS]
    formula: "UTC_time = Birth_time - Timezone_offset; if <0 date-=1day; if >=24h date+=1day"
    key_constants:
      IST_offset: "+5:30"
      IST_pitfall: Any Indian birth before 05:30 IST falls on the PREVIOUS UTC date
    example_sandeep: "07:00 IST - 5:30 = 01:30 UTC same date (05 Feb 1984)"
    example_ajay: "04:15 IST - 5:30 = -1:15 -> 30 Dec 1987 22:45 UTC (previous date)"

  - calc_id: CALC-2
    name: UTC DateTime to Julian Day Number
    source: Meeus Astronomical Algorithms Ch.7
    inputs: [year_Y, month_M, day_fraction_D]
    outputs: [JD_float]
    formula: |
      D = day + (hour + min/60 + sec/3600)/24
      if M<=2: Y=Y-1; M=M+12
      A=INT(Y/100); B=2-A+INT(A/4)
      JD=INT(365.25*(Y+4716))+INT(30.6001*(M+1))+D+B-1524.5
    pitfalls:
    - JD starts at NOON not midnight; births at midnight UT have 0.5 in JD
    - M<=2 treats Jan/Feb as months 13/14 of previous year
    example_sandeep: JD=2445735.5625 for 05 Feb 1984 01:30 UT

  - calc_id: CALC-3
    name: Julian Day to Lahiri Ayanamsa
    source: BPHS Ch.2; Govt of India 1955; Swiss Ephemeris SIDM_LAHIRI
    inputs: [JD]
    outputs: [ayanamsa_degrees]
    formula_approx: "Ayanamsa = 22.460494 + 0.013955 * ((JD - 2415020.5) / 365.25)"
    formula_exact: "swe.set_sid_mode(swe.SIDM_LAHIRI); swe.get_ayanamsa_ut(JD)"
    key_fact: Ayanamsa increases ~50.3 arcseconds/year (precession of equinoxes)
    current_approx: "~24.1 degrees in 2026"
    example_sandeep: "23.634920 degrees for JD 2445735.5625"

  - calc_id: CALC-4
    name: Tropical Longitude to Sidereal Longitude
    source: BPHS Ch.2
    inputs: [tropical_longitude_0_360, ayanamsa]
    outputs: [sidereal_longitude_0_360]
    formula: "Sidereal = Tropical - Ayanamsa; if <0 add 360; if >=360 subtract 360"
    critical_warning: Planets near sign cusps within ~24 degrees CHANGE SIGN sidereal vs tropical

  - calc_id: CALC-5
    name: Sidereal Longitude to Sign Degree House
    source: BPHS Ch.11
    inputs: [sidereal_longitude, lagna_sign_number_1_to_12]
    outputs: [sign_number_1_12, degrees_in_sign_0_30, house_number_1_12]
    formula: |
      sign_number = FLOOR(sidereal_long / 30) + 1
      deg_in_sign = sidereal_long MOD 30
      house = ((sign_number - lagna_sign_number) MOD 12) + 1
    house_system: Whole_Sign
    sign_map:
      1: Aries
      2: Taurus
      3: Gemini
      4: Cancer
      5: Leo
      6: Virgo
      7: Libra
      8: Scorpio
      9: Sagittarius
      10: Capricorn
      11: Aquarius
      12: Pisces

  - calc_id: CALC-6
    name: Sidereal Longitude to Nakshatra and Pada
    source: BPHS Ch.3 Ch.94
    inputs: [sidereal_longitude]
    outputs: [nakshatra_number_1_27, nakshatra_name, pada_1_4, nakshatra_lord, deg_into_nak]
    formula: |
      nak_number = FLOOR(sidereal_long / 13.3333) + 1
      deg_into_nak = sidereal_long MOD 13.3333
      pada = FLOOR(deg_into_nak / 3.3333) + 1
    critical: Moons nakshatra determines starting Vimshottari Mahadasha
    pitfall: Nakshatras do NOT align with sign boundaries (Krittika spans Aries-Taurus)
    example_sandeep: "Moon at 325.2195 -> Nak 25 Purva Bhadrapada Pada 2 -> Jupiter lord"

  - calc_id: CALC-7
    name: Combustion Check
    source: BPHS Ch.3
    inputs: [sun_sidereal_long, planet_sidereal_long]
    outputs: [combust_bool_per_planet]
    formula: "angular_diff = abs(planet-sun); if >180 use 360-diff; COMBUST if diff < orb"
    orbs_degrees:
      Moon: 12
      Mercury_direct: 14
      Mercury_retrograde: 13
      Venus_direct: 10
      Venus_retrograde: 8
      Mars: 17
      Jupiter: 11
      Saturn: 15
      Rahu: null
      Ketu: null
    impact_ranking: Jupiter > Venus > Saturn > Mars > Moon > Mercury
    note: Mercury combust is most frequent and least severe

  - calc_id: CALC-8
    name: Retrograde Check
    source: BPHS Ch.3
    inputs: [planet_daily_speed_from_ephemeris]
    outputs: [retrograde_bool]
    formula: "speed < 0 -> RETROGRADE"
    special_cases:
      Sun: never_retrograde
      Moon: never_retrograde
      Rahu: always_retrograde_mean_motion
      Ketu: always_retrograde_mean_motion
    bphs_rule: "Vakri-grahah ucca-tulyah -- retrograde planet power equals exalted"

  - calc_id: CALC-9
    name: Navamsha D9 Sign
    source: BPHS Ch.6
    inputs: [sidereal_longitude]
    outputs: [d9_sign_number_1_12]
    formula: "D9_sign_index = FLOOR(sidereal_long / 3.3333) MOD 12"
    sign_index_map: "0=Ar 1=Ta 2=Ge 3=Ca 4=Le 5=Vi 6=Li 7=Sc 8=Sg 9=Cp 10=Aq 11=Pi"
    d9_start_by_type:
      Movable: {signs: [Aries, Cancer, Libra, Capricorn], starts_from: Aries, index: 0}
      Fixed:   {signs: [Taurus, Leo, Scorpio, Aquarius],  starts_from: Capricorn, index: 9}
      Dual:    {signs: [Gemini, Virgo, Sagittarius, Pisces], starts_from: Libra, index: 6}
    critical: Always cross-verify with Swiss Ephemeris -- pada boundary off-by-one is the top D9 error
    vargottama: Same sign D1 and D9 = Vargottama = strength multiplier 1.20

  - calc_id: CALC-10
    name: Vimshottari Dasha Balance at Birth
    source: BPHS Ch.46
    inputs: [moon_nakshatra_number, deg_into_nakshatra]
    outputs: [starting_md_lord, remaining_years_float, dasha_sequence_with_dates]
    formula: |
      elapsed_fraction = deg_into_nak / 13.3333
      remaining_fraction = 1 - elapsed_fraction
      remaining_years = remaining_fraction * dasha_lord_total_years
    dasha_years:
      Ketu: 7
      Venus: 20
      Sun: 6
      Moon: 10
      Mars: 7
      Rahu: 18
      Jupiter: 16
      Saturn: 19
      Mercury: 17
    total_years: 120
    sequence: [Ketu, Venus, Sun, Moon, Mars, Rahu, Jupiter, Saturn, Mercury]
    critical: A few arcminutes Moon error shifts dasha boundaries by months -- birth time accuracy is essential
    example_sandeep: |
      Moon nak 25 lord Jupiter (16yr); deg_into_nak=5.2195; remaining=9.736yr
      Jupiter_MD ends Oct 1993; Saturn_MD Oct1993-Oct2012
      Mercury_MD Oct2012-Oct2029 (CURRENT 2026); Venus_MD Oct2036-Oct2056 (LIFE_PEAK)

  - calc_id: CALC-11
    name: Antardasha Calculation
    source: BPHS Ch.46
    inputs: [md_lord_years, ad_lord_years]
    outputs: [ad_duration_years]
    formula: "AD_duration = (AD_lord_years / 120) * MD_lord_years"
    sequence_rule: First AD within MD is MD lord itself then follows fixed Vimshottari sequence
    example_mercury_md:
      Mer_Mer: 2.408
      Mer_Ket: 0.992
      Mer_Ven: 2.833
      Mer_Sun: 0.850
      Mer_Moo: 1.417
      Mer_Mar: 0.992
      Mer_Rah: 2.550
      Mer_Jup: 2.267
      Mer_Sat: 2.692

  - calc_id: CALC-12
    name: Darakaraka Jaimini Spouse Significator
    source: Jaimini Sutras 1.1.50-52
    inputs: [degrees_in_sign_all_7_classical_planets]
    outputs: [darakaraka, atmakaraka, amatyakaraka]
    formula: "Minimum degree_in_sign planet = Darakaraka; Maximum = Atmakaraka; 2nd highest = Amatyakaraka"
    example_sandeep: "Sun=21.80 Moon=25.22 Mars=18.45 Mercury=0.61 Jupiter=9.75 Venus=18.97 Saturn=22.42 -> DK=Mercury AK=Moon"

  - calc_id: CALC-13
    name: Upapada Lagna Marriage Significator
    source: "Jaimini Sutras Ch.2; BPHS Ch.12"
    inputs: [h12_sign, h12_lord_placement_sign]
    outputs: [upapada_lagna_sign]
    formula: |
      Count signs from H12 to H12-lord's sign inclusive = X
      UL = X signs forward from H12-lord's sign
      Exception: if lord is in own H12, count 12 forward = H11 sign
    example_sandeep: "UL = Scorpio; UL lord Mars in H10 = spouse professionally accomplished"

  - calc_id: CALC-14
    name: Mangal Dosha Check
    source: "Jataka Parijata Ch.9; Muhurta Chintamani"
    inputs: [mars_house_from_lagna, mars_house_from_moon, mars_house_from_venus]
    outputs: [dosha_present_bool, cancellation_met, cancellation_reason]
    dosha_houses: [1, 2, 4, 7, 8, 12]
    check_from: [Lagna, Moon_sign, Venus_sign]
    cancellations_any_one_cancels:
    - Mars in own sign Aries or Scorpio
    - Mars exalted in Capricorn
    - Jupiter aspects Mars via 5th 7th or 9th
    - Mars conjunct Jupiter or waxing Moon
    - Mars in H1 for Aries Leo Sagittarius Lagna
    - Mars in H2 for Gemini Virgo Lagna
    - Mars in H4 for Scorpio Cancer Lagna
    - Mars in H7 for Cancer Capricorn Lagna
    - Mars in H8 for Sagittarius Pisces Lagna
    - Mars in H12 for Taurus Libra Lagna
    - Partner also Manglik
    - Age 28 plus intensity reduces significantly
    warning: Most over-diagnosed condition; always verify ALL 11 cancellation conditions

  - calc_id: CALC-15
    name: Yoga Detection 8-Step Verification
    source: "BPHS Ch.36; Phaladeepika Ch.6"
    inputs: [candidate_yoga_definition, planet_positions, dignities, aspects, houses]
    outputs: [confirmed_denied_partial, strength_grade, activation_dasha]
    steps:
      A: Identify required planets; verify they exist
      B: Check sign and house placement meets conditions
      C: Check dignity; exalted or own = strong yoga
      D: Check combustion; combust = weakened yoga
      E: Check aspects; benefic strengthens; malefic weakens
      F: Check counter-conditions; is yoga cancelled
      G: Assign strength grade Strong Moderate Weak
      H: Identify timing; yoga manifests in Dasha of involved planets
    critical_pitfall: Yoga on paper but Dasha never runs in active lifetime equals zero real results


    condition: Planet in own OR exalted sign AND in Kendra H1/H4/H7/H10
    Ruchaka: {planet: Mars,    signs: [Aries, Scorpio, Capricorn], quality: warrior_leader}
    Bhadra:  {planet: Mercury, signs: [Gemini, Virgo], quality: scholar_analyst}

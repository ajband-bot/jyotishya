    authority_tier: T4
    domain_tags: [transit, ashtakavarga, bindhu, strength-threshold]
    ocr_signal: VA304 bhava(16); VA325 yoga(18)
    canonical_statement: >
      Evaluate transit favorability through Sarvashtakavarga bindhu count in
      the sign transited. Signs with 30+ bindhu (out of 337 maximum) support
      favorable transit results; signs with fewer than 25 bindhu indicate
      suppressed or delayed results. Individual planetary Ashtakavarga
      (PAV) of the transiting planet additionally refines this to 4+ bindhu
      (favorable) vs 3 or fewer (unfavorable) in that sign.
    activation_conditions:
    - Sarvashtakavarga computation complete for natal chart
    - Planet's own PAV in the transit sign computed
    - Transit sign bindhu count retrieved
    exclusions:
    - Ashtakavarga alone does not override a strong dasha + transit confluence
    scoring_hooks:
      base_fulfillment: bindhu_threshold_check
      sav_bindhu_favorable_threshold: 30
      sav_bindhu_unfavorable_threshold: 25
      pav_bindhu_favorable: 4
      pav_bindhu_unfavorable: 3
      favorable_multiplier: 1.10
      unfavorable_multiplier: 0.85
    graph_mapping:

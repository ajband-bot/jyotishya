  transit_engine_rules:

  - rule_id: TR-001
    rule_name: Gochara-Natal Activation Engine
    authority_tier: T4
    domain_tags: [transit, gochara, natal-trigger, timing]
    ocr_signal: VA325 yoga(18); VA304 dasha(11)
    canonical_statement: >
      A transit planet activates natal promises when it occupies a sign that
      is (a) the natal position, (b) the 5th/9th trine from natal, or (c) a
      sign owned by a natal planet involved in the promise. Transit activation
      is suppressed if the transiting planet receives Vedha obstruction from
      another concurrent transit of a adversarial planet.
    activation_conditions:
    - Transit planet longitude and sign known
    - Natal promise identified (relevant bhava and activating graha)
    - Vedha obstruction check performed for all concurrent slow transits
    scoring_hooks:
      base_fulfillment: transit_position_match
      trine_resonance_bonus: 1.05
      natal_lord_transit_bonus: 1.10
      vedha_suppression_multiplier: 0.70

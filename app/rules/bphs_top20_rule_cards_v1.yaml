    - Planet B occupies sign ruled by Planet A
    - Neither planet is in debilitation in the exchanged sign (verify)
    exclusions:
    - Nodes (Rahu/Ketu) cannot participate in Parivartana
    - If one planet is combust, yoga strength is halved
    scoring_hooks:
      base_fulfillment: binary_mutual_occupation
      parivartana_multiplier: 1.25
      combustion_half_penalty: true
    graph_mapping:
      requires_nodes: [PlanetA, PlanetB, SignA, SignB]
